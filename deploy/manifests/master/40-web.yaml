# KubeDoor Web 控制台:nginx 提供静态页面 + 反向代理到 master / alarm / grafana / ai
#
# 权限模型:
#   nginx basic auth 认证通过后,按用户名映射出 read / rw 两种权限($user_permission),
#   只读用户只能走下面显式列出的查询类接口,其余 /api/ 一律 403。
apiVersion: v1
kind: Secret
metadata:
  name: nginx-auth
  namespace: __NAMESPACE__
  labels:
    app: kubedoor-web
type: Opaque
data:
  user.passwd: __WEB_AUTH_B64__

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: __NAMESPACE__
  labels:
    app: kubedoor-web
data:
  nginx.conf: |
    user  nginx;
    worker_processes  auto;

    error_log  /var/log/nginx/error.log notice;
    pid        /var/run/nginx.pid;

    events {
        worker_connections  1024;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;
        map "$time_iso8601 # $msec" $time_iso8601_ms { "~(^[^+]+)(\+[0-9:]+) # \d+\.(\d+)$" $1.$3$2; }
        log_format main
            '{"timestamp":"$time_iso8601_ms",'
            '"server_ip":"$server_addr",'
            '"remote_ip":"$remote_addr",'
            '"xff":"$http_x_forwarded_for",'
            '"remote_user":"$remote_user",'
            '"domain":"$host",'
            '"url":"$request_uri",'
            '"referer":"$http_referer",'
            '"upstreamtime":"$upstream_response_time",'
            '"responsetime":"$request_time",'
            '"request_method":"$request_method",'
            '"status":"$status",'
            '"response_length":"$bytes_sent",'
            '"request_length":"$request_length",'
            '"protocol":"$server_protocol",'
            '"upstreamhost":"$upstream_addr",'
            '"http_user_agent":"$http_user_agent",'
            '"【body】": "$request_body"'
            '}';

        access_log  /var/log/nginx/access.log  main;
        # AI requests carry provider keys and uploaded kubeconfigs. Never log
        # their body, headers, or query string, including on failed requests.
        log_format ai_safe escape=json
            '{"timestamp":"$time_iso8601","remote_user":"$remote_user",'
            '"method":"$request_method","path":"$uri","status":"$status"}';

        sendfile        on;
        keepalive_timeout  7200;
        client_max_body_size 50m;

        include /etc/nginx/conf.d/*.conf;
    }

  default.conf: |
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 用户名 -> 权限。没列出来的账号一律只读。
    map $remote_user $user_permission {
        default "read";
        __WEB_RW_USER_MAP__
    }

    auth_basic "KubeDoor Login";
    auth_basic_user_file /etc/nginx/user.passwd;

    upstream kubedoor_master { server kubedoor-master.__NAMESPACE__:80; }
    upstream kubedoor_alarm  { server kubedoor-alarm.__NAMESPACE__:80;  }

    server {
        listen 80;

        # Internal bridges require a service token and must never be public.
        location ^~ /api/ai/internal/ {
            access_log /var/log/nginx/access.log ai_safe;
            return 404;
        }

        location ^~ /api/ai/ {
            include /etc/nginx/ai-security/gateway.conf;
            proxy_set_header X-User-Name $remote_user;
            proxy_set_header X-User-Permission $user_permission;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 3600;
            proxy_buffering off;
            proxy_cache off;
            client_max_body_size 2m;
            access_log /var/log/nginx/access.log ai_safe;
            proxy_pass http://kubedoor-ai.__NAMESPACE__:8000;
        }

        # ---------- 静态页面(前端是 hash 路由,不需要 try_files) ----------
        location / {
            root /www/dist;
            index index.html;
        }

        # ---------- Grafana 看板 ----------
        # BEGIN-GRAFANA
        location /grafana/ {
            proxy_set_header Host $host;
            proxy_pass http://kubedoor-dash.__NAMESPACE__:3000;
        }

        location /grafana/api/live/ {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_pass http://kubedoor-dash.__NAMESPACE__:3000;
        }
        # END-GRAFANA

        # ---------- 只读用户也放行的查询类接口 ----------
        # /api/db/* 是参数化的数据库 REST 接口(已替代早期直传 SQL 的 /api/sql)。
        # 这里白名单的都是纯查询,写操作(add/edit/delete/operate/revoke 等)
        # 不在名单里,会落到下面的 location /api/ 被拦截。
        location ~ ^/api/db/(res/(envs|namespaces|deployments|max_day|list|collection)|agent/show_add_label|alert/(envs|names|total|detail|detail_total)|silence/(list|label_values|preview))$ {
            proxy_read_timeout 300;
            proxy_set_header X-User-Name $remote_user;
            proxy_set_header X-User-Permission $user_permission;
            proxy_pass http://kubedoor_master;
        }

        # 实时指标(集群概览、节点排名、工作负载监控)
        location ~ ^/api/prom_ {
            proxy_read_timeout 300;
            proxy_set_header X-User-Name $remote_user;
            proxy_set_header X-User-Permission $user_permission;
            proxy_pass http://kubedoor_master;
        }

        # TOP10 / 告警趋势统计
        location ~ ^/api/stats/ {
            proxy_read_timeout 300;
            proxy_pass http://kubedoor_master;
        }

        location /api/events {
            proxy_read_timeout 300;
            proxy_pass http://kubedoor_master;
        }

        location /api/image/tags {
            proxy_read_timeout 300;
            proxy_pass http://kubedoor_master;
        }

        location /api/get_dpm_pods {
            proxy_read_timeout 300;
            proxy_pass http://kubedoor_master;
        }

        location /api/agent_names {
            proxy_read_timeout 300;
            proxy_pass http://kubedoor_master;
        }

        location /api/agent/pods {
            proxy_read_timeout 300;
            proxy_pass http://kubedoor_master;
        }

        location /api/agent/namespaces {
            proxy_read_timeout 300;
            proxy_pass http://kubedoor_master;
        }

        # ---------- 自定义告警投递(kubedoor-alarm) ----------
        location /api/custom_alert {
            if ($user_permission = "read") {
                return 403;
            }
            proxy_read_timeout 60;
            proxy_pass http://kubedoor_alarm;
        }

        # ---------- WebSocket ----------
        # Pod 日志流:只读用户也能看日志
        location /ws/pod-logs {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600;
            proxy_pass http://kubedoor_master;
        }

        # Deployment/Pod 实时状态推送:只读数据,只读用户也放行(不加这段会落到下面 rw-only 的 /ws)
        location /ws/workload-status {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600;
            proxy_pass http://kubedoor_master;
        }

        # agent 注册通道:必须 rw(跨集群的 agent 用预置账号连进来)
        location /ws {
            if ($user_permission = "read") {
                return 403;
            }
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600;
            proxy_pass http://kubedoor_master;
        }

        # ---------- 改镜像:权限由 master 按 UPDATE_IMAGE 配置二次校验 ----------
        location /api/update-image {
            proxy_set_header X-User-Name $remote_user;
            proxy_set_header X-User-Permission $user_permission;
            proxy_read_timeout 300;
            proxy_pass http://kubedoor_master;
        }

        # ---------- 其余接口一律需要 rw ----------
        location /api/ {
            if ($user_permission = "read") {
                return 403;
            }
            proxy_read_timeout 600;
            proxy_set_header X-User-Name $remote_user;
            proxy_set_header X-User-Permission $user_permission;
            proxy_pass http://kubedoor_master;
        }

        # ---------- MCP(SSE 长连接) ----------
        # BEGIN-MCP
        location ~ ^/(mcp|sse|messages)(/|$) {
            include /etc/nginx/ai-security/gateway.conf;
            proxy_set_header X-User-Name $remote_user;
            proxy_set_header X-User-Permission $user_permission;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_buffering off;
            proxy_cache off;
            access_log /var/log/nginx/access.log ai_safe;
            proxy_pass http://kubedoor-ai.__NAMESPACE__:8000;
        }
        # END-MCP
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubedoor-web
  namespace: __NAMESPACE__
  labels:
    app: kubedoor-web
    app.kubernetes.io/part-of: kubedoor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubedoor-web
  template:
    metadata:
      labels:
        app: kubedoor-web
    spec:
      volumes:
        - name: ai-security
          secret:
            secretName: kubedoor-ai-security
            items:
              - key: gateway.conf
                path: gateway.conf
        - name: nginx-auth
          secret:
            secretName: nginx-auth
        - name: nginx-config
          configMap:
            name: nginx-config
      containers:
        - name: kubedoor-web
          image: '__IMAGE_REPO__/kubedoor-web:__TAG_WEB__'
          imagePullPolicy: Always
          env:
            - name: TZ
              value: Asia/Shanghai
          ports:
            - name: http
              containerPort: 80
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: ai-security
              mountPath: /etc/nginx/ai-security
              readOnly: true
            - name: nginx-auth
              mountPath: /etc/nginx/user.passwd
              subPath: user.passwd
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          livenessProbe:
            tcpSocket:
              port: 80
            timeoutSeconds: 2
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 80
            timeoutSeconds: 2
            periodSeconds: 10
            failureThreshold: 3
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: kubedoor-web
  namespace: __NAMESPACE__
  labels:
    app: kubedoor-web
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
__WEB_NODEPORT_LINE__
  selector:
    app: kubedoor-web
