# kubedoor-config:master / alarm / ai 共用的环境变量
# 改完后需要重启对应 Deployment 才生效:
#   kubectl -n __NAMESPACE__ rollout restart deploy/kubedoor-master deploy/kubedoor-alarm
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubedoor-config
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/part-of: kubedoor
data:
  # --- PostgreSQL(统一数据库,已不再使用 ClickHouse / MySQL)---
  PG_HOST: '__PG_HOST__'
  PG_PORT: '__PG_PORT__'
  PG_USER: '__PG_USER__'
  PG_PASSWORD: '__PG_PASSWORD__'
  PG_DATABASE: '__PG_DATABASE__'
  PG_POOL_MIN: '__PG_POOL_MIN__'
  PG_POOL_MAX: '__PG_POOL_MAX__'
  PG_CMD_TIMEOUT: '__PG_CMD_TIMEOUT__'

  # --- 时序库 ---
  PROM_TYPE: '__PROM_TYPE__'
  PROM_URL: '__PROM_URL__'
  PROM_K8S_TAG_KEY: '__PROM_K8S_TAG_KEY__'

  # --- 通知 ---
  MSG_TYPE: '__MSG_TYPE__'
  MSG_TOKEN: '__MSG_TOKEN__'
  DEFAULT_AT: '__DEFAULT_AT__'
  ALERTMANAGER_EXTURL: '__ALERTMANAGER_EXTURL__'
  KUBEDOOR_EXTURL: '__KUBEDOOR_EXTURL__'

  # --- 行为参数 ---
  LOG_LEVEL: "INFO"
  ALERT_DEDUP_WINDOW: '__ALERT_DEDUP_WINDOW__'
  SILENCE_CACHE_TTL: '__SILENCE_CACHE_TTL__'
  # admis 准入校验的热路径查询缓存(秒)。改管控配置后会主动失效,不必调小
  ADMIS_CACHE_TTL: "60"
  # 过期数据保留天数,master 每天清理一次;设为 0 表示不清理
  RETENTION_EVENTS_DAYS: "90"
  RETENTION_ALERTS_DAYS: "365"
  RETENTION_RESOURCES_DAYS: "365"
  RETENTION_AUDIT_DAYS: "180"
  # 企微里再也不会继续的旧 AI 对话,多少天后删除它的检查点(kubedoor-ai 每 6 小时清理一次,消息记录保留);0 表示不清理
  RETENTION_AI_CHECKPOINT_DAYS: "7"
  # 节点终端临时 pod 用的镜像(需含 nsenter),master 开终端时下发给 agent。
  # 留空 = 用 agent 内置的默认镜像(registry.cn-shenzhen.aliyuncs.com/starsl/alpine:3);
  # 集群拉不到时换成内网仓库里的镜像,改完重启 master 即可,不用动各集群的 agent
  NODE_SHELL_IMAGE: ""

  # --- 登录与权限(账号、LDAP、集群授权都在 Web 的「系统管理」里配置)---
  # agent 连 master 必须带账号口令(MASTER_WS 里写 Agent 账号)。升级过渡期可临时设为 "false"
  AGENT_AUTH_REQUIRED: '__AGENT_AUTH_REQUIRED__'
  # 登录有效期:不勾「记住我」12 小时(空闲 4 小时自动退出),勾选后 7 天
  AUTH_SESSION_HOURS: "12"
  AUTH_IDLE_HOURS: "4"
  AUTH_REMEMBER_DAYS: "7"
  # 同一账号 + 来源 IP 连续登录失败几次后锁定多少分钟
  AUTH_LOGIN_MAX_FAILURES: "5"
  AUTH_LOCK_MINUTES: "15"
  # 会话 Cookie 的 Secure 标记:auto 按请求是否 HTTPS 判断;nginx 前面还有一层做 TLS 的负载均衡时设为 "true"
  AUTH_COOKIE_SECURE: "auto"

  # --- 改镜像的权限控制:哪个集群、什么时间段、谁可以改 ---
  UPDATE_IMAGE: |
    __UPDATE_IMAGE_JSON__

  # --- 查询镜像 tag 用的仓库凭据 ---
  REGISTRY_SECRET: |
    __REGISTRY_SECRET_JSON__
