[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kubedoor-tools"
version = "0.1.0"
description = "Shared, cluster-bound Kubernetes tools for KubeDoor agents and MCP"
requires-python = ">=3.11"
dependencies = ["kubernetes>=37", "PyYAML>=6.0.2"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.25"]

[tool.setuptools.packages.find]
where = ["."]
include = ["kubedoor_tools*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
