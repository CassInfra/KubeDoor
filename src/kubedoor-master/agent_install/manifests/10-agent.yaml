# kubedoor-agent:每个被纳管的 K8S 集群装一套。
# 通过 WebSocket 主动连到 master,接收指令后用 ServiceAccount 的权限操作本集群,
# 同时把 K8S 事件流回传给 master 入库。
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubedoor-agent-config
  namespace: __NAMESPACE__
  labels:
    app: kubedoor-agent
data:
  # master 的 WebSocket 地址,要带 Agent 账号口令:ws://<账号>:<口令>@<地址>(同集群、跨集群都一样)
  KUBEDOOR_MASTER: '__MASTER_WS__'
  # 本集群的名字,必须和指标里 <PROM_K8S_TAG_KEY> 标签的值一致
  PROM_K8S_TAG_VALUE: '__K8S_NAME__'
  # Java 服务 dump/jfr/jstack 的结果上传地址,留空则这些功能不可用
  OSS_URL: '__OSS_URL__'

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubedoor-agent
  namespace: __NAMESPACE__

---
apiVersion: v1
kind: Secret
metadata:
  name: kubedoor-agent
  namespace: __NAMESPACE__
  annotations:
    kubernetes.io/service-account.name: "kubedoor-agent"
type: kubernetes.io/service-account-token

---
# 最小权限原则：覆盖 Agent 的运维扩缩容、节点调度、负载均衡、资源管理、Istio/CCI、事件/日志/终端和准入开关，
# 禁止写入 Secret、RBAC (Role/ClusterRole/Binding) 及修改非本工作台管理的 Webhook。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubedoor-agent-cr
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - configmaps
      - persistentvolumeclaims
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources:
      - nodes
      - namespaces
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources:
      - nodes/proxy
      - nodes/metrics
      - pods/log
      - pods/status
    verbs: ["get"]
  - apiGroups: [""]
    resources:
      - pods/exec
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources:
      - pods/eviction
    verbs: ["create"]
  - apiGroups: [""]
    resources:
      - endpoints
      - events
      - persistentvolumes
      - replicationcontrollers
      - resourcequotas
      - limitranges
      - secrets
      - serviceaccounts
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/scale
      - statefulsets
      - statefulsets/scale
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingressclasses
      - networkpolicies
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
      - volumeattachments
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources:
      - mutatingwebhookconfigurations
    verbs: ["create", "list"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources:
      - mutatingwebhookconfigurations
    resourceNames:
      - kubedoor-admis-configuration
    verbs: ["get", "update", "patch", "delete"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources:
      - validatingwebhookconfigurations
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - nodes
      - pods
    verbs: ["get", "list"]
  - apiGroups: ["networking.istio.io"]
    resources:
      - virtualservices
      - destinationrules
      - gateways
      - serviceentries
      - sidecars
      - workloadentries
      - workloadgroups
      - envoyfilters
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["scheduling.cci.io"]
    resources:
      - scheduleprofiles
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs: ["get", "list", "watch"]
  - nonResourceURLs:
      - /version
      - /healthz
      - /readyz
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubedoor-agent-crb
subjects:
  - kind: ServiceAccount
    name: kubedoor-agent
    namespace: __NAMESPACE__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubedoor-agent-cr

---
# AI 只读服务账号：专用于 AI Kubeconfig，禁止读取 Secret、执行 pods/exec 或任何写操作
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubedoor-ai-readonly
  namespace: __NAMESPACE__

---
apiVersion: v1
kind: Secret
metadata:
  name: kubedoor-ai-readonly
  namespace: __NAMESPACE__
  annotations:
    kubernetes.io/service-account.name: "kubedoor-ai-readonly"
type: kubernetes.io/service-account-token

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubedoor-ai-readonly-cr
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
      - services
      - endpoints
      - events
      - configmaps
      - nodes
      - namespaces
      - persistentvolumes
      - persistentvolumeclaims
      - replicationcontrollers
      - resourcequotas
      - limitranges
      - serviceaccounts
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/scale
      - statefulsets
      - statefulsets/scale
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - ingressclasses
      - networkpolicies
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
      - volumeattachments
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources:
      - mutatingwebhookconfigurations
      - validatingwebhookconfigurations
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - nodes
      - pods
    verbs: ["get", "list"]
  - apiGroups: ["networking.istio.io", "security.istio.io", "telemetry.istio.io"]
    resources:
      - virtualservices
      - destinationrules
      - gateways
      - serviceentries
      - sidecars
      - workloadentries
      - workloadgroups
      - authorizationpolicies
      - peerauthentications
      - requestauthentications
      - telemetries
    verbs: ["get", "list", "watch"]
  - apiGroups: ["scheduling.cci.io"]
    resources:
      - scheduleprofiles
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authentication.k8s.io"]
    resources:
      - selfsubjectreviews
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources:
      - selfsubjectaccessreviews
    verbs: ["create"]
  - nonResourceURLs:
      - /version
      - /api
      - /apis
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubedoor-ai-readonly-crb
subjects:
  - kind: ServiceAccount
    name: kubedoor-ai-readonly
    namespace: __NAMESPACE__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubedoor-ai-readonly-cr

---
# 默认仅放行 TCP 443 端口（webhook 与健康检查），隐式阻断 pod-mgr :81 等非预期端口；
# 生产环境建议按集群控制面 / kube-apiserver 网段进一步收紧 ingress[].from.ipBlock。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubedoor-agent-netpol
  namespace: __NAMESPACE__
  labels:
    app: kubedoor-agent
spec:
  podSelector:
    matchLabels:
      app: kubedoor-agent
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 443

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubedoor-agent
  namespace: __NAMESPACE__
  labels:
    app: kubedoor-agent
    app.kubernetes.io/part-of: kubedoor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubedoor-agent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: kubedoor-agent
    spec:
      serviceAccountName: kubedoor-agent
      containers:
        - name: kubedoor-agent
          image: '__IMAGE_REPO__/kubedoor-agent:__TAG_AGENT__'
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: kubedoor-agent-config
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: https
              containerPort: 443
          volumeMounts:
            - name: webhook-tls
              mountPath: /etc/kubedoor/certs
              readOnly: true
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 50m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 443
              scheme: HTTPS
            initialDelaySeconds: 20
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 443
              scheme: HTTPS
            initialDelaySeconds: 5
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: webhook-tls
          secret:
            secretName: kubedoor-agent-webhook-tls
            optional: true
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: kubedoor-agent
  namespace: __NAMESPACE__
  labels:
    app: kubedoor-agent
spec:
  type: ClusterIP
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: 443
  selector:
    app: kubedoor-agent
