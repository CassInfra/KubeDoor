# KubeDoor 内部运行默认值，供网页安装服务及旧版安装工具使用。
# 数据库、集群标签、组件选择等由网页安装向导覆盖。
# 发行镜像版本在 deploy/install.sh 的镜像配置区维护。

NAMESPACE="kubedoor"
KUBE_CONTEXT=""
PROM_K8S_TAG_KEY="origin_prometheus"
PG_PORT="5432"
PG_USER="kubedoor"
PG_DATABASE="kubedoor"
PG_POOL_MIN="2"
PG_POOL_MAX="20"
PG_CMD_TIMEOUT="60"
AGENT_AUTH_REQUIRED="true"
ALERTMANAGER_EXTURL=""
ALERT_DEDUP_WINDOW="300"
SILENCE_CACHE_TTL="15"
ENABLE_GRAFANA="true"
GRAFANA_ADMIN_USER="admin"
GRAFANA_ADMIN_PASSWORD="admin"
ENABLE_MCP="true"
ENABLE_VMALERT="true"
ENABLE_ALERTMANAGER="true"
ALERTMANAGER_NODEPORT=""
ENABLE_VMAGENT="true"
ENABLE_KUBE_STATE_METRICS="true"
ENABLE_NODE_EXPORTER="true"
OSS_URL=""
