# 内置账号的初始口令,只在 master 首次启动建账号时使用;留空用出厂口令
# (kubedoor / kubedoor,首次登录强制改密;Agent 账号 Up4biLko1dNh / qCa22jDkfc9y)。
# 账号建好后改口令请到 Web 页面操作,改这里不会生效。
apiVersion: v1
kind: Secret
metadata:
  name: kubedoor-auth-init
  namespace: __NAMESPACE__
  labels:
    app: kubedoor-master
type: Opaque
stringData:
  KUBEDOOR_INIT_ADMIN_PASSWORD: '__KUBEDOOR_INIT_ADMIN_PASSWORD__'
  KUBEDOOR_INIT_AGENT_PASSWORD: '__KUBEDOOR_INIT_AGENT_PASSWORD__'

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubedoor-master
  namespace: __NAMESPACE__
  labels:
    app: kubedoor-master
    app.kubernetes.io/part-of: kubedoor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubedoor-master
  strategy:
    # master 持有 agent 的 WebSocket 长连接,滚动更新期间不并存两个实例,
    # 避免 agent 在新旧实例之间反复重连
    type: Recreate
  template:
    metadata:
      labels:
        app: kubedoor-master
      annotations:
        # 安装脚本算的配置摘要(kubedoor-config + 告警规则):配置一变就重启,环境变量和告警规则都只在启动时读取
        checksum/config: '__CONFIG_HASH_MASTER__'
    spec:
      containers:
        - name: kubedoor-master
          image: '__IMAGE_REPO__/kubedoor-master:__TAG_MASTER__'
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: kubedoor-config
            - secretRef:
                name: kubedoor-auth-init
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: AI_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kubedoor-ai-security
                  key: AI_INTERNAL_TOKEN
            # LDAP 绑定密码等敏感配置入库前用它加密(与 AI 的 kubeconfig 加密共用一个密钥)
            - name: AI_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: kubedoor-ai-security
                  key: AI_ENCRYPTION_KEY
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: kubedoor-master-file-cfg
              mountPath: /k8s_event/rules
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: 80
            # 启动时要建连接池 + 建表,给足 60s 再开始探活
            initialDelaySeconds: 60
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 3
      restartPolicy: Always
      volumes:
        - name: kubedoor-master-file-cfg
          configMap:
            name: kubedoor-master-file-cfg
            items:
              - key: alert_rules.json
                path: alert_rules.json

---
apiVersion: v1
kind: Service
metadata:
  name: kubedoor-master
  namespace: __NAMESPACE__
  labels:
    app: kubedoor-master
spec:
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
  selector:
    app: kubedoor-master

---
# 每天北京时间 01:00 触发一次高峰期资源数据采集,结果写入 PostgreSQL 的 k8s_resources
# timeZone 需要 K8S 1.25+;install.sh 检测到更老的集群会去掉 BEGIN/END-CRON-TZ 之间这一行,
# 此时按 CronJob 控制器的时区执行
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kubedoor-collect
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/part-of: kubedoor
spec:
  schedule: "0 1 * * *"
  # BEGIN-CRON-TZ
  timeZone: Asia/Shanghai
  # END-CRON-TZ
  concurrencyPolicy: Forbid
  suspend: false
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: kubedoor-collect
              image: '__IMAGE_BUSYBOX_CURL__'
              imagePullPolicy: Always
              # master 的接口都要认证,集群内部任务用内部 token(系统身份)调用
              env:
                - name: AI_INTERNAL_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: kubedoor-ai-security
                      key: AI_INTERNAL_TOKEN
              command:
                - /bin/sh
                - -c
                - >-
                  curl -sf --max-time 1800 -H "X-Kubedoor-Token: ${AI_INTERNAL_TOKEN}"
                  'http://kubedoor-master.__NAMESPACE__/api/cron_peak_data'
              resources:
                limits:
                  cpu: 200m
                  memory: 128Mi
                requests:
                  cpu: 10m
                  memory: 16Mi
