# kubedoor-config:master / alarm / ai 共用的 PostgreSQL 连接(旧版配置式安装脚本使用;网页安装放在 Secret kubedoor-connection)
# 其余配置(时序库地址、访问地址、对象存储、Agent 镜像、数据保留天数、登录安全等)存在数据库里,
# 在控制台「系统管理 → 通用配置」修改,保存后生效,不用重启。
# 改完下面的连接配置后需要重启对应 Deployment 才生效:
#   kubectl -n __NAMESPACE__ rollout restart deploy/kubedoor-master deploy/kubedoor-alarm deploy/kubedoor-ai
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubedoor-config
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/part-of: kubedoor
data:
  # --- PostgreSQL(统一数据库,已不再使用 ClickHouse / MySQL)---
  PG_HOST: '__PG_HOST__'
  PG_PORT: '__PG_PORT__'
  PG_USER: '__PG_USER__'
  PG_PASSWORD: '__PG_PASSWORD__'
  PG_DATABASE: '__PG_DATABASE__'
  PG_POOL_MIN: '__PG_POOL_MIN__'
  PG_POOL_MAX: '__PG_POOL_MAX__'
  PG_CMD_TIMEOUT: '__PG_CMD_TIMEOUT__'
